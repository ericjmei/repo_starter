name: CI

on:
  push:
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Pixi
        run: curl -fsSL https://pixi.sh/install.sh | bash

      - name: Add Pixi to PATH
        run: echo "$HOME/.pixi/bin" >> $GITHUB_PATH

      - name: Install dev environment
        run: pixi install -e dev

      - name: Ruff lint
        run: pixi run -e dev ruff check . --exclude notebooks

      - name: Ruff format (check only)
        run: pixi run -e dev ruff format --check . 

      - name: Pytest
        run: pixi run -e dev pytest
