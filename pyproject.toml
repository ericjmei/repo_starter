[project]
authors = [{name = "Eric", email = "eric.mei2000@gmail.com"}]
dependencies = []
name = "repo_starter"
requires-python = ">= 3.11"
version = "0.1.0"

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64", "win-64", "osx-64", "osx-arm64"]

[tool.pixi.pypi-dependencies]
repo_starter = { path = ".", editable = true }

[tool.pixi.tasks]

[tool.pixi.dependencies]
jupyterlab = ">=4.5.3,<5"
numpy = ">=2.4.2,<3"
scipy = ">=1.17.0,<2"
xarray = ">=2026.1.0,<2027"
matplotlib = ">=3.10.8,<4"

[tool.pixi.environments]
default = { solve-group = "default" }
dev = { features = ["lint", "test"], solve-group = "default" }

[dependency-groups]
test = ["pytest"]
lint = ["ruff"]
